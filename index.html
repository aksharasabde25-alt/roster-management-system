<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Roster Manager</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--fg:#13202f;--mut:#5d6b7e;--card:#fff;--bd:#dbe1ea;--W:#c9f0dd;--WO:#e6e9ef;--H:#e3dcf9;--L:#ffe3b0;--C:#cfe4ff;--bad:#b42318;--badbg:#fde1de;--ok:#157347;--warn:#9a5b00;--ac:#0f766e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1420;--fg:#e6ebf2;--mut:#93a1b5;--card:#142030;--bd:#27374b;--W:#17493a;--WO:#2a3647;--H:#3a3160;--L:#5a4413;--C:#1d3f6b;--bad:#ff9b92;--badbg:#5a2320;--ok:#74d6a0;--warn:#ffc36b;--ac:#4fd1c5}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.5 Manrope,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}#app{display:contents}
aside{background:#0f1b2d;color:#dbe5f2;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}aside small{margin-top:auto;color:#8ea0b8}
.brand{font-size:21px;font-weight:800;letter-spacing:-.3px;padding:0 8px}.brand b{color:#4fd1c5}
nav{display:flex;flex-direction:column;gap:4px}nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600}
nav button:hover{background:#1b2b44}nav button.on{background:#4fd1c5;color:#08201e}nav em{font-style:normal;font-size:12px;opacity:.75}nav em.e{background:#e5484d;color:#fff;border-radius:99px;padding:0 8px;opacity:1}
main{padding:22px 26px 48px;min-width:0}h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:0}h3{margin:20px 0 8px}
small{color:var(--mut);display:block;font-size:11px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}.act,.bar,.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.act{margin:0}
button,select,input{font:inherit;padding:7px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}button{cursor:pointer;font-weight:600}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:24px;line-height:1.2;color:var(--fg)}.kpi .ok b{color:var(--ok)}.kpi .bad b{color:var(--bad)}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--card)}.seg button{border:0;border-radius:0}.seg button.on{background:var(--ac);color:#fff}
.note{color:var(--mut)}.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px;font-size:12px}.legend span{padding:2px 9px;border-radius:6px;font-weight:600}.legend i{color:var(--mut);margin-left:6px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.e{background:var(--badbg);color:var(--bad)}.w{background:var(--L);color:var(--warn)}.i{background:var(--C)}.g{background:var(--W);color:var(--ok)}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);max-width:100%}table{border-collapse:collapse;width:100%}
.g2 th,.g2 td{padding:4px 5px;border:1px solid var(--bd);white-space:nowrap;font-size:12px}.g2 td.c,.g2 th{text-align:center;min-width:28px}.g2 th{background:var(--card);font-weight:700}
.g2 .nm{position:sticky;left:0;background:var(--card);text-align:left;min-width:170px;z-index:1;font-weight:600}.g2 td.c{font-weight:700;font-size:11px}
.sun{background:var(--WO)!important}.hol{background:var(--H)!important}.W{background:var(--W)}.WO{background:var(--WO)}.H{background:var(--H)}.L{background:var(--L)}.C{background:var(--C)}
td.c{cursor:pointer}td.c:hover{filter:brightness(.93)}.cv td.bad{background:var(--badbg);color:var(--bad)}.cv td.ok{color:var(--ok)}.cv td.cl{color:var(--mut)}
.msg{background:var(--C);padding:9px 14px;border-radius:10px;margin:8px 0;font-weight:600}.msg.ok2{background:var(--W);color:var(--ok)}
.l td,.l th{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.l th{color:var(--mut);font-size:12px}
.m td{padding:3px}.m input,.m select{width:100%}ul{padding-left:18px}
.login{grid-column:1/-1;display:grid;place-items:center;min-height:100vh;padding:20px;background:#0f1b2d}.lc{background:var(--card);padding:32px;border-radius:16px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}.lc .brand{padding:0;color:var(--fg)}.lc p{margin:0;color:var(--mut)}.lc label{display:flex;flex-direction:column;gap:4px;font-weight:600}#lerr{color:var(--bad);min-height:18px;font-weight:600}aside button{background:#1b2b44;color:#fff;border-color:#27374b}
@media(max-width:780px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}aside small{display:none}nav{flex-direction:row;flex-wrap:wrap}main{padding:14px}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],CAL={'365':'365 days','NOHOL':'Daily except holidays','NOSUNHOL':'Off Sundays + holidays'};
let lvl='all',S,R={},ISS=[],view='company',sel='',tab='roster',msg='',pub=false;
function seed(){const pods=[['Alpha','Riya Sharma'],['Beta','Karan Mehta'],['Gamma','Neha Iyer'],['Delta','Arjun Rao']],procs=[],emps=[];let pi=0,ei=0;
const P=(b,n,c,m=1,ms)=>{const id='P'+ ++pi;procs.push({id,brand:b,name:n,cal:c,min:m,minSun:ms});return id},
E=(n,pod,pr,pref)=>emps.push({id:'E'+ ++ei,name:n,pod,procs:pr,pref,leaves:[],comp:[]});
let cs=P('Zesty Wear','CS','365'),ac=P('Zesty Wear','ACC','NOSUNHOL'),nd=P('Zesty Wear','NDR','NOSUNHOL');
E('Aarav Patil','Alpha',[cs],1);E('Isha Verma','Alpha',[cs,nd],2);E('Meera Joshi','Alpha',[ac],0);
cs=P('GlowUp Skin','CS','365');let rt=P('GlowUp Skin','RET','NOSUNHOL');
E('Rohan Desai','Alpha',[cs],3);E('Sana Khan','Alpha',[cs],4);E('Tanvi Kulkarni','Alpha',[rt],0);
cs=P('UrbanKart','CS','NOHOL',2);nd=P('UrbanKart','NDR','NOSUNHOL');
E('Dev Malhotra','Beta',[cs],1);E('Priya Nair','Beta',[cs],2);E('Kabir Singh','Beta',[cs,nd],0);
cs=P('PetPals','CS','NOSUNHOL');ac=P('PetPals','ACC','NOSUNHOL');E('Nikhil Rane','Gamma',[cs],0);E('Pooja Bhat','Gamma',[ac],0);
const sb=['NutriBowl','FitFuel','HomeNest','TechTrove','BabyBloom','SoleMate','Kaffeine','BrewBox','AuraJewels','GreenLeaf','ToyTown','LuxeLoom','SipSmart','MotoGear','BookBarn','ChicChoice'],
nm=['Vivek Kale','Anjali Pawar','Sameer Shaikh','Kavya Reddy','Omkar Jadhav','Shruti Menon','Harsh Gupta','Divya Bose','Yash Thakur','Ritika Das','Manav Chopra','Pallavi Rao','Siddharth Jain','Aditi Kapoor','Faisal Ahmed','Lakshmi Iyer'],fl=[];
sb.forEach((b,i)=>{const big=i==3||i==9,c=big?'365':'NOSUNHOL',ids=[P(b,'CS',c)];if(i%3==0)ids.push(P(b,'ACC',c));if(i%5==0)ids.push(P(b,'NDR',c));if(big)fl.push(...ids);E(nm[i],pods[i%4][0],ids,big?(i==3?3:4):0)});
E('Vikram Sethi (floater)','Delta',fl,2);pods.forEach(([p,l])=>E(l,p,[],0));
emps[0].leaves.push('2026-12-14');emps[3].comp.push('2026-12-11');
return{month:'2026-12',hol:['2026-12-25'],pods:pods.map(([name,lead])=>({name,lead})),procs,emps}}
const pad=n=>String(n).padStart(2,'0'),days=()=>{const[y,m]=S.month.split('-').map(Number);return[...Array(new Date(y,m,0).getDate())].map((_,i)=>`${y}-${pad(m)}-${pad(i+1)}`)},
dow=d=>new Date(d+'T00:00:00').getDay(),isH=d=>S.hol.includes(d),PR=id=>S.procs.find(p=>p.id==id),
op=(p,d)=>p.cal=='365'||(!isH(d)&&(p.cal=='NOHOL'||dow(d)!=0)),
need=(p,d)=>op(p,d)?(dow(d)==0&&p.minSun!=null&&p.minSun!==''?+p.minSun:+p.min):0,
reqd=(e,d)=>e.procs.length?e.procs.some(id=>op(PR(id),d)):(dow(d)!=0&&!isH(d)),
have=(p,d,ex)=>S.emps.filter(x=>x.id!=ex&&x.procs.includes(p.id)&&R[x.id][d]=='W').length,
short=(e,d)=>e.procs.reduce((s,id)=>{const p=PR(id);return s+(need(p,d)>0&&have(p,d,e.id)<need(p,d)?1:0)},0);
function weeksOf(D){const o=(dow(D[0])+6)%7,w={};D.forEach((d,i)=>(w[Math.floor((i+o)/7)]??=[]).push(d));return Object.values(w).filter(x=>x.length>=5)}
/* Generator: statuses from rules/leaves, then 1 weekly off per week chosen by least coverage damage, then preference, then fairness */
function gen(){const D=days();R={};
S.emps.forEach(e=>{R[e.id]={};D.forEach(d=>R[e.id][d]=e.leaves.includes(d)?'L':e.comp.includes(d)?'C':reqd(e,d)?'W':isH(d)?'H':'WO')});
weeksOf(D).forEach(ws=>S.emps.forEach(e=>{if(ws.some(d=>['WO','C'].includes(R[e.id][d])))return;let best=null,bs=1e9;
ws.forEach(d=>{if(R[e.id][d]!='W')return;const sc=short(e,d)*100+(dow(d)==e.pref?0:5)+S.emps.filter(x=>R[x.id][d]=='WO').length;if(sc<bs){bs=sc;best=d}});
if(best)R[e.id][best]='WO'}));pub=false}
function validate(){const D=days(),I=[];
S.procs.forEach(p=>D.forEach(d=>{const n=need(p,d),h=have(p,d);if(h>=n)return;
const as=S.emps.filter(x=>x.procs.includes(p.id)),free=as.filter(x=>R[x.id][d]=='WO'),
t2=S.emps.filter(x=>R[x.id][d]=='WO'&&x.procs.length&&!as.includes(x)&&as.some(a=>a.pod==x.pod)),c=free.length?free:t2,lv=as.filter(x=>R[x.id][d]=='L').map(x=>x.name);
I.push({s:'error',d,pid:p.id,brand:p.brand,cand:!free.length&&c[0]?c[0].id:'',cn:c[0]?c[0].name:'',who:`${p.brand} · ${p.name}`,t:`Needs ${n}, only ${h} working`+(lv.length?` (${lv.join(', ')} on leave)`:''),
fix:c.length?`Ask ${c.slice(0,3).map(x=>x.name).join(', ')} (on weekly off) to work, and give a comp-off`:'No one free: arrange a backup resource or relax the coverage rule'})}));
const W=weeksOf(D);S.emps.forEach(e=>{W.forEach(ws=>{
if(!ws.some(d=>['WO','C'].includes(R[e.id][d])))I.push({s:'error',d:ws[0],who:e.name,t:'No weekly off this week',fix:'Assign a weekly off or comp-off'});
const pd=ws.find(d=>dow(d)==e.pref);if(pd&&R[e.id][pd]=='W'&&reqd(e,pd)&&!ws.some(d=>R[e.id][d]=='WO'&&dow(d)==e.pref))I.push({s:'info',d:pd,who:e.name,t:`Preferred off day (${DN[e.pref]}) not given: coverage takes priority`,fix:'No action needed'})});
let r=0;D.forEach(d=>{r=R[e.id][d]=='W'?r+1:0;if(r==7)I.push({s:'warn',d,who:e.name,t:'7+ consecutive working days',fix:'Move a weekly off earlier or add a comp-off'})})});
return I.sort((a,b)=>({error:0,warn:1,info:2}[a.s]-{error:0,warn:1,info:2}[b.s])||a.d.localeCompare(b.d))}
const refresh=()=>{ISS=validate();render()},up=(k,i,f,v)=>{S[k][i][f]=v;gen();refresh()},
cnt=s=>ISS.filter(i=>i.s==s).length;
function cyc(id,d){const e=S.emps.find(x=>x.id==id),o=['W','WO','H','L','C'],n=o[(o.indexOf(R[id][d])+1)%5];R[id][d]=n;e.leaves=e.leaves.filter(x=>x!=d);e.comp=e.comp.filter(x=>x!=d);if(n=='L')e.leaves.push(d);if(n=='C')e.comp.push(d);pub=false;refresh()}
function grid(emps,procs){const D=days();
let h=`<div class="sc"><table class="g2"><tr><th class="nm">Employee</th>${D.map(d=>`<th class="${isH(d)?'hol':dow(d)==0?'sun':''}">${+d.slice(8)}<small>${DN[dow(d)][0]}</small></th>`).join('')}<th>Days</th></tr>`;
h+=emps.map(e=>`<tr><td class="nm">${e.name}<small>${e.pod} · ${e.procs.map(id=>PR(id).brand+' '+PR(id).name).join(', ')||'Pod lead'}</small></td>${D.map(d=>`<td class="c ${R[e.id][d]}" onclick="cyc('${e.id}','${d}')">${R[e.id][d]}</td>`).join('')}<td>${D.filter(d=>R[e.id][d]=='W').length}</td></tr>`).join('');
procs.forEach(p=>h+=`<tr class="cv"><td class="nm">${p.brand} ${p.name}<small>working / needed</small></td>${D.map(d=>{const n=need(p,d),v=have(p,d);return`<td class="c ${n?v<n?'bad':'ok':'cl'}">${n?v+'/'+n:'–'}</td>`}).join('')}<td></td></tr>`);
return h+'</table></div>'}
const opts=(a,s)=>a.map(([v,l])=>`<option value="${v}" ${v==s?'selected':''}>${l}</option>`).join('');
function rosterView(){const O={company:[],pod:S.pods.map(p=>[p.name,p.name]),brand:[...new Set(S.procs.map(p=>p.brand))].map(b=>[b,b]),process:S.procs.map(p=>[p.id,p.brand+' · '+p.name]),employee:S.emps.map(e=>[e.id,e.name])};
if(!O[view].some(o=>o[0]==sel))sel=(O[view][0]||[''])[0];let em,pr,note='';
if(view=='company'){em=S.emps;pr=S.procs}
else if(view=='pod'){em=S.emps.filter(e=>e.pod==sel);pr=[...new Set(em.flatMap(e=>e.procs))].map(PR);note=`Pod lead: ${(S.pods.find(p=>p.name==sel)||{}).lead}`}
else if(view=='brand'){pr=S.procs.filter(p=>p.brand==sel);em=S.emps.filter(e=>e.procs.some(id=>PR(id).brand==sel))}
else if(view=='process'){pr=[PR(sel)];em=S.emps.filter(e=>e.procs.includes(sel))}
else{em=S.emps.filter(e=>e.id==sel);pr=[];const D=days(),e=em[0];note=e?['W','WO','H','L','C'].map(s=>`${s}: ${D.filter(d=>R[e.id][d]==s).length}`).join(' · '):''}
return`<div class="tool"><div class="seg">${['company','pod','brand','process','employee'].map(v=>`<button class="${view==v?'on':''}" onclick="view='${v}';sel='';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>${O[view].length?`<select onchange="sel=this.value;render()">${opts(O[view],sel)}</select>`:''}<span class="note">${note}</span></div><div class="legend"><span class="W">W Working</span><span class="WO">WO Weekly off</span><span class="H">H Holiday</span><span class="L">L Leave</span><span class="C">C Comp-off</span><i>Click a cell to change it. Red means a coverage gap.</i></div>${grid(em,pr)}`}
function issues(L){return L.length?`<div class="sc"><table class="l"><tr><th>Level</th><th>Date</th><th>Where</th><th>Issue</th><th>Suggested fix</th></tr>${L.map(i=>`<tr><td><span class="pill ${i.s[0]}">${i.s}</span></td><td>${i.d}</td><td>${i.who}</td><td>${i.t}</td><td>${i.fix}${i.cand?`<br><button onclick="backup('${i.cand}','${i.pid}')">Add ${i.cn} as backup for ${i.brand}</button>`:''}</td></tr>`).join('')}</table></div>`:'<p>No issues found.</p>'}
let lE='',lD='';
function leave(id,d,mode){const e=S.emps.find(x=>x.id==id);if(!e)return;lE=id;if(!d||!days().includes(d)){msg='Pick a date inside '+S.month+'.';render();return}lD=d;const b=cnt('error');if(!e.leaves.includes(d))e.leaves.push(d);mode=='keep'?R[id][d]='L':gen();ISS=validate();const a=cnt('error');
msg=`Leave added for ${e.name} on ${d} (${mode=='keep'?'roster kept':'roster regenerated'}). ${a>b?(a-b)+' new coverage gap(s) found, see Current errors below.':a?a+' coverage gap(s) still open, see Current errors below.':'No new gap: the rest of the team still covers that day.'} Errors: ${b} → ${a}.`;render()}
function backup(eid,pid){const e=S.emps.find(x=>x.id==eid),b=PR(pid).brand;S.procs.filter(p=>p.brand==b).forEach(p=>{if(!e.procs.includes(p.id))e.procs.push(p.id)});gen();ISS=validate();msg=`${e.name} added as backup for ${b}. Roster regenerated. Errors now: ${cnt('error')}.`;render()}
function unleave(id,d){const e=S.emps.find(x=>x.id==id);e.leaves=e.leaves.filter(x=>x!=d);gen();ISS=validate();msg=`Leave removed for ${e.name} on ${d}; roster regenerated.`;render()}
function changeView(){if(!lE||!S.emps.some(e=>e.id==lE))lE=S.emps[0].id;if(!lD)lD=S.month+'-10';const D=days(),ls=S.emps.flatMap(e=>e.leaves.filter(d=>D.includes(d)).map(d=>[e,d]));
return`<p>Add a leave after the roster exists. <b>Keep roster</b> only flags the new gaps; <b>Regenerate</b> rebuilds weekly offs around the leave.</p><div class="bar"><select id="le" onchange="lE=this.value">${opts(S.emps.map(e=>[e.id,e.name]),lE)}</select><input id="ld" type="date" value="${lD}" onchange="lD=this.value"><button onclick="leave($('#le').value,$('#ld').value,'keep')">Keep roster, flag gaps</button><button onclick="leave($('#le').value,$('#ld').value,'regen')">Regenerate</button><button class="p" onclick="const e=S.emps.find(x=>x.name=='Vivek Kale')||S.emps[0];leave(e.id,S.month+'-10','keep')">Run demo: single-resource brand on leave</button></div>${msg?`<div class="msg">${msg}</div>`:''}
<h3>Leaves this month</h3><div class="bar"><button onclick="S=seed();gen();ISS=validate();msg='Sample data restored: all demo leaves and changes cleared.';render()">Reset to sample data</button></div>${ls.length?`<div class="sc"><table class="l">${ls.map(([e,d])=>`<tr><td>${e.name}</td><td>${d}</td><td><button onclick="unleave('${e.id}','${d}')">Remove</button></td></tr>`).join('')}</table></div>`:'<p>None.</p>'}<h3>Current errors</h3>${issues(ISS.filter(i=>i.s=='error'))}`}
function manage(){const mi=(k,i,f,t='text')=>`<input type="${t}" value="${S[k][i][f]??''}" onchange="up('${k}',${i},'${f}',this.value)">`,po=S.pods.map(p=>[p.name,p.name]),pp=S.procs.map(p=>[p.id,p.brand+' · '+p.name]);
return`<h3>Public holidays (comma-separated dates)</h3><input style="width:100%" value="${S.hol.join(',')}" onchange="S.hol=this.value.split(',').map(x=>x.trim()).filter(Boolean);gen();refresh()">
<h3>Pods</h3><table class="m">${S.pods.map((p,i)=>`<tr><td>${p.name}</td><td>${mi('pods',i,'lead')}</td></tr>`).join('')}</table><div class="bar"><input id="np" placeholder="New pod name"><button onclick="if($('#np').value){S.pods.push({name:$('#np').value,lead:'TBD'});refresh()}">Add pod</button></div>
<h3>Processes (brand, calendar, minimum staff, Sunday minimum)</h3><div class="sc"><table class="m"><tr><th>Brand</th><th>Process</th><th>Operating calendar</th><th>Min</th><th>Min Sun</th><th></th></tr>${S.procs.map((p,i)=>`<tr><td>${mi('procs',i,'brand')}</td><td>${mi('procs',i,'name')}</td><td><select onchange="up('procs',${i},'cal',this.value)">${opts(Object.entries(CAL),p.cal)}</select></td><td>${mi('procs',i,'min','number')}</td><td>${mi('procs',i,'minSun','number')}</td><td><button onclick="const id=S.procs[${i}].id;S.procs.splice(${i},1);S.emps.forEach(e=>e.procs=e.procs.filter(x=>x!=id));gen();refresh()">✕</button></td></tr>`).join('')}</table></div>
<div class="bar"><button onclick="S.procs.push({id:'P'+Date.now(),brand:'New Brand',name:'CS',cal:'NOSUNHOL',min:1});gen();refresh()">Add process</button></div>
<h3>Employees (pod, preferred weekly off, assigned processes: ctrl/cmd-click for several)</h3><div class="sc"><table class="m"><tr><th>Name</th><th>Pod</th><th>Pref off</th><th>Processes</th><th></th></tr>${S.emps.map((e,i)=>`<tr><td>${mi('emps',i,'name')}</td><td><select onchange="up('emps',${i},'pod',this.value)">${opts(po,e.pod)}</select></td><td><select onchange="up('emps',${i},'pref',+this.value)">${opts(DN.map((d,j)=>[j,d]),e.pref)}</select></td><td><select multiple size="3" onchange="up('emps',${i},'procs',[...this.selectedOptions].map(o=>o.value))">${pp.map(([v,l])=>`<option value="${v}" ${e.procs.includes(v)?'selected':''}>${l}</option>`).join('')}</select></td><td><button onclick="S.emps.splice(${i},1);gen();refresh()">✕</button></td></tr>`).join('')}</table></div>
<div class="bar"><button onclick="S.emps.push({id:'E'+Date.now(),name:'New Employee',pod:S.pods[0].name,procs:[],pref:0,leaves:[],comp:[]});gen();refresh()">Add employee</button></div>`}
const about=`<h3>How it works</h3><ul><li><b>Data model:</b> pods → employees; processes belong to a brand and carry the operating calendar and minimum staff; employees are linked to one or more processes (a single-resource brand = one employee linked to all its processes).</li><li><b>Generator:</b> marks leaves, comp-offs, holidays and calendar-closed days, then gives each employee one weekly off per week, choosing the day that hurts coverage least, then their preferred day, then the least crowded day (fairness).</li><li><b>Validation:</b> mandatory (errors): coverage per process per day, weekly off present. Warnings: 7+ consecutive days. Preferences (info) never override coverage.</li><li><b>Assumptions:</b> one weekly off per week; an employee counts toward every process they are assigned to on days they work; weeks with fewer than 5 days in the month are skipped; pod leads work Mon–Sat; one shift per day.</li><li><b>Human control:</b> the system suggests fixes but never reassigns people on its own; publishing is blocked while errors remain.</li></ul>`;
const cov=()=>{let n=0,k=0;days().forEach(d=>S.procs.forEach(p=>{const q=need(p,d);if(q){n++;if(have(p,d)>=q)k++}}));return n?Math.round(100*k/n):100};
const USER='manager',HASH='673ad420e4e19a95bca1b627e2bce15ccd9f371737d998684107df8e2e4790ac';let auth=false,tries=0,lockUntil=0;try{auth=sessionStorage.getItem('rm')=='1'}catch(e){}
function loginView(){$('#app').innerHTML=`<div class="login"><div class="lc"><div class="brand">Roster<b>Desk</b></div><h1>Welcome, manager</h1><p>Sign in to plan, validate and publish team rosters.</p><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><div id="lerr"></div><button class="p" onclick="login()">Sign in</button></div></div>`}
async function login(){const err=$('#lerr');if(Date.now()<lockUntil){err.textContent='Too many attempts. Try again in a few seconds.';return}
const u=$('#lu').value.trim(),b=new TextEncoder().encode('rosterdesk:'+$('#lp').value),x=[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(v=>v.toString(16).padStart(2,'0')).join('');
if(u==USER&&x==HASH){auth=true;tries=0;try{sessionStorage.setItem('rm','1')}catch(e){}render()}else{tries++;if(tries>=3){lockUntil=Date.now()+30000;tries=0;err.textContent='Too many attempts. Locked for 30 seconds.'}else err.textContent='Wrong username or password.'}}
function logout(){auth=false;try{sessionStorage.removeItem('rm')}catch(e){}render()}
function render(){if(!auth)return loginView();const T={roster:'Monthly roster',issues:'Conflicts',change:'Handle a change',manage:'Manage data',about:'About'},ne=cnt('error'),c=cov(),
t=[['roster','Roster','▦'],['issues','Conflicts',ISS.length],['change','Handle a change','↻'],['manage','Manage data','✎'],['about','About','ⓘ']],
body=tab=='roster'?rosterView():tab=='issues'?`<div class="bar">${['all','error','warn','info'].map(k=>`<button class="${lvl==k?'p':''}" onclick="lvl='${k}';render()">${k=='all'?'All':k=='error'?'Errors':k=='warn'?'Warnings':'Preferences'}</button>`).join('')}</div>`+issues(ISS.filter(i=>lvl=='all'||i.s==lvl)):tab=='change'?changeView():tab=='manage'?manage():about;
$('#app').innerHTML=`<aside><div class="brand">Roster<b>Desk</b></div><nav>${t.map(([k,l,x])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()"><span>${l}</span><em class="${k=='issues'&&ne?'e':''}">${x}</em></button>`).join('')}</nav><small>Signed in as manager</small><button onclick="logout()">Sign out</button></aside><main><div class="top"><h1>${T[tab]}</h1><div class="act"><input type="month" value="${S.month}" onchange="S.month=this.value;gen();refresh()"><button onclick="gen();msg='';refresh()">Regenerate</button><button class="p" onclick="if(cnt('error')){msg='Publish blocked: fix '+cnt('error')+' coverage errors first.'}else{pub=true;msg='Roster published.'}render()">Publish roster</button></div></div>
<div class="kpi"><div><b>${S.emps.length}</b>Employees</div><div><b>${new Set(S.procs.map(p=>p.brand)).size}</b>Brands</div><div class="${c==100?'ok':'bad'}"><b>${c}%</b>Process-days covered</div><div class="${ne?'bad':'ok'}"><b>${ne}</b>Coverage errors</div><div><b>${cnt('warn')}</b>Warnings</div></div>${pub?'<div class="msg ok2">Roster published.</div>':''}${msg&&tab!='change'?`<div class="msg">${msg}</div>`:''}${body}</main>`}
S=seed();gen();ISS=validate();render();
</script></body></html>
